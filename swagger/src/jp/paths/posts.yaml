get:
  summary: 投稿一覧を取得します
  responses:
    "200":
      description: HTTPステータスコード200と投稿一覧を含むJSONオブジェクトを返します。
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/post.yaml

post:
  summary: 新規投稿を作成します
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - userId
            - title
            - body
          properties:
            userId:
              type: integer
              example: 1
            title:
              type: string
              example: 初めてのブログ記事
            body:
              type: string
              example: 今日はブログを始めました。日々の学びや気づきを、少しずつ記事にしていきたいと思います。どうぞよろしくお願いします。
  responses:
    "201":
      description: HTTPステータスコード201と作成された投稿を含むJSONオブジェクトを返します。
      content:
        application/json:
          schema:
            $ref: ../schemas/post.yaml
