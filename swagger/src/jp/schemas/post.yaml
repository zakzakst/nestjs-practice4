type: object

required:
  - userId
  - id
  - title
  - body

properties:
  userId:
    type: integer
    example: 1

  id:
    type: integer
    example: 1

  title:
    type: string
    example: "初めてのブログ記事"

  body:
    type: string
    example: "今日はブログを始めました。日々の学びや気づきを、少しずつ記事にしていきたいと思います。どうぞよろしくお願いします。"
