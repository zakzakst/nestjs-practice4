type: object

properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: 山田 太郎
  username:
    type: string
    example: ヤマちゃん
  email:
    type: string
    format: email
    example: yamada@mail.com
  address:
    type: object
    properties:
      street:
        type: string
        # example: TODO（Kulas Light）
      suite:
        type: string
        # example: TODO（Apt. 556）
      city:
        type: string
        # example: TODO（Gwenborough）
      zipcode:
        type: string
        # example: TODO（92998-3874）
      geo:
        type: object
        properties:
          lat:
            type: string
            # example: TODO（-37.3159）
          lng:
            type: string
            # example: TODO（81.1496）
  phone:
    type: string
    example: 08012345678
  website:
    type: string
    format: uri
    example: https://www.yamada.com
  company:
    type: object
    properties:
      name:
        type: string
        example: 株式会社○○
      catchPhrase:
        type: string
        example: ✕✕に関する不安をすべて解決
      bs:
        type: string
        # example: TODO（harness real-time e-markets）
