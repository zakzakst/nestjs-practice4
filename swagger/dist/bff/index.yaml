openapi: 3.0.3
info:
  title: BFF API
  version: 1.0.0
  description: BFF API
servers:
  - url: http://127.0.0.1:3000
paths:
  /posts:
    get:
      summary: 投稿一覧取得
      parameters:
        - in: query
          name: page
          schema:
            type: string
            example: 1
        - in: query
          name: limit
          schema:
            type: string
            example: 20
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 100
                  limit:
                    type: integer
                    example: 20
                  page:
                    type: integer
                    example: 1
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/post'
    post:
      summary: 新規投稿作成
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - title
                - body
              properties:
                userId:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: 初めてのブログ記事
                body:
                  type: string
                  example: 今日はブログを始めました。日々の学びや気づきを、少しずつ記事にしていきたいと思います。どうぞよろしくお願いします。
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post'
  /posts/{id}:
    get:
      summary: 投稿取得
      parameters:
        - name: id
          in: path
          required: true
          description: 投稿ID
          schema:
            type: integer
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post'
    put:
      summary: 投稿更新
      parameters:
        - name: id
          in: path
          required: true
          description: 投稿ID
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post'
    delete:
      summary: 投稿削除
      parameters:
        - name: id
          in: path
          required: true
          description: 投稿ID
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
  /users/{id}:
    get:
      summary: ユーザー取得
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
    put:
      summary: ユーザー更新
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
    delete:
      summary: ユーザー削除
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    post:
      type: object
      required:
        - userId
        - id
        - title
        - body
      properties:
        userId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 初めてのブログ記事
        body:
          type: string
          example: 今日はブログを始めました。日々の学びや気づきを、少しずつ記事にしていきたいと思います。どうぞよろしくお願いします。
    user:
      type: object
      required:
        - id
        - name
        - username
        - email
        - address
        - phone
        - website
        - company
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 山田 太郎
        username:
          type: string
          example: ヤマちゃん
        email:
          type: string
          format: email
          example: yamada@mail.com
        address:
          type: object
          required:
            - street
            - suite
            - city
            - zipcode
            - geo
          properties:
            street:
              type: string
            suite:
              type: string
            city:
              type: string
            zipcode:
              type: string
            geo:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: string
                lng:
                  type: string
        phone:
          type: string
          example: 8012345678
        website:
          type: string
          format: uri
          example: https://www.yamada.com
        company:
          type: object
          required:
            - name
            - catchPhrase
            - bs
          properties:
            name:
              type: string
              example: 株式会社○○
            catchPhrase:
              type: string
              example: ✕✕に関する不安をすべて解決
            bs:
              type: string
